<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Heritage CCE responsive review</title><style>body{margin:0;background:#bfc6ce;font:14px Arial}header{display:flex;gap:16px;align-items:center;padding:10px;background:#fff;position:relative;z-index:2}iframe{border:0;display:block;transform-origin:top left;background:white}select,button{padding:8px}#stage{margin:16px}button[aria-pressed=true]{background:#1a2a4a;color:white}</style></head><body><header><label>Page <select id="route"><option value="/">Home</option><option value="/services">Services</option><option value="/peelclear">PeelClear</option><option value="/about">About</option><option value="/facility">Facility</option><option value="/contact">Contact</option><option value="/warranty">Warranty</option></select></label><button id="desktop" aria-pressed="true">Desktop 1440 × 900</button><button id="mobile" aria-pressed="false">Mobile 390 × 844</button><span id="status">Desktop frame</span></header><div id="stage"><iframe title="Heritage CCE review" src="/" width="1440" height="900"></iframe></div><script>const frame=document.querySelector('iframe');function size(m){frame.width=m?390:1440;frame.height=m?844:900;frame.style.transform=m?'none':'scale(.85)';document.querySelector('#mobile').setAttribute('aria-pressed',m);document.querySelector('#desktop').setAttribute('aria-pressed',!m);document.querySelector('#status').textContent=m?'Mobile frame':'Desktop frame';}document.querySelector('#route').addEventListener('change',e=>frame.src=e.target.value);document.querySelector('#mobile').onclick=()=>size(true);document.querySelector('#desktop').onclick=()=>size(false);size(false);</script></body></html>
