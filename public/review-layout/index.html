<!doctype html><html lang="en"><head><title>Temporary responsive review</title><meta name="robots" content="noindex,nofollow"><style>body{margin:0;background:#dbe2eb;font:14px system-ui}header{padding:8px}iframe{display:block;border:0;transform-origin:top left}select{padding:6px}</style></head><body><header><label>Page <select id="page"><option value="services">Services</option><option value="about">About</option><option value="">Home</option></select></label> <label>Viewport <select id="size"><option value="desktop">1440 × 900</option><option value="mobile">390 × 844</option></select></label></header><iframe title="Site review" width="1440" height="900" src="/services" style="transform:scale(.85)"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#page').onchange=e=>frame.src='/'+e.target.value;document.querySelector('#size').onchange=e=>{const mobile=e.target.value==='mobile';frame.width=mobile?390:1440;frame.height=mobile?844:900;frame.style.transform=mobile?'none':'scale(.85)';};</script></body></html>
